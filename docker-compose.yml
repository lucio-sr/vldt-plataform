services:
  db:
    image: pgvector/pgvector:pg16
    container_name: labvie-db
    environment:
      POSTGRES_USER: labvie
      POSTGRES_PASSWORD: labvie
      POSTGRES_DB: labvie
    ports:
      - "5432:5432"
    volumes:
      - labvie_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labvie -d labvie"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: labvie-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  labvie_pgdata:
